name: Kooyu
packages:
  JOSESwift:
    url: https://github.com/airsidemobile/JOSESwift.git
    exactVersion: 3.0.0
options:
  bundleIdPrefix: app.kooyu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.2.1
    CURRENT_PROJECT_VERSION: 4
targets:
  Kooyu:
    dependencies:
      - package: JOSESwift
    type: application
    platform: iOS
    sources:
      - path: Kooyu
        excludes: [TerminalAssets]
      - path: Kooyu/TerminalAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kooyu.ios
        INFOPLIST_FILE: Kooyu/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kooyu/Kooyu.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APNS_ENVIRONMENT: development
          KOOYU_APNS_ENVIRONMENT: sandbox
        Release:
          APNS_ENVIRONMENT: production
          KOOYU_APNS_ENVIRONMENT: production
    scheme:
      testTargets: [KooyuTests]
  KooyuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KooyuTests]
    dependencies:
      - target: Kooyu
