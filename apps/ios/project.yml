name: Kooyu
options:
  bundleIdPrefix: app.kooyu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.2.1
    CURRENT_PROJECT_VERSION: 4
targets:
  Kooyu:
    type: application
    platform: iOS
    sources: [Kooyu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kooyu.ios
        INFOPLIST_FILE: Kooyu/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [KooyuTests]
  KooyuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KooyuTests]
    dependencies:
      - target: Kooyu
