name: Native application releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
env:
  KOOYU_OFFICIAL_ACCOUNT_ORIGIN: ${{ vars.KOOYU_OFFICIAL_ACCOUNT_ORIGIN }}
  KOOYU_OFFICIAL_RELAY_ORIGIN: ${{ secrets.KOOYU_OFFICIAL_RELAY_ORIGIN }}
  KOOYU_OFFICIAL_RELEASE: "1"
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - id: release
        run: node .github/scripts/release.mjs metadata >> "$GITHUB_OUTPUT"
  checks:
    uses: ./.github/workflows/ci.yml
  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - name: Build desktop installers
        env:
          KOOYU_OFFICIAL_RELEASE: "1"
          KOOYU_OFFICIAL_ACCOUNT_ORIGIN: ${{ vars.KOOYU_OFFICIAL_ACCOUNT_ORIGIN }}
          KOOYU_OFFICIAL_RELAY_ORIGIN: ${{ secrets.KOOYU_OFFICIAL_RELAY_ORIGIN }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ulimit -n 65536
            sudo mdutil -a -i off || true
          fi
          for attempt in 1 2; do
            if npm run package:desktop -- --publish never; then
              break
            fi
            if [[ "$RUNNER_OS" != "macOS" || "$attempt" -eq 2 ]]; then
              exit 1
            fi
            echo "macOS DMG packaging hit transient hdiutil lock; detaching stale Kooyu volumes and retrying..."
            while IFS= read -r dev; do
              [ -n "$dev" ] && hdiutil detach -force "$dev" || true
            done < <(hdiutil info | awk '/\/Volumes\/Kooyu/{print $1}')
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kooyu-${{ matrix.platform }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.AppImage
            release/desktop/*.deb
          if-no-files-found: error
  android:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KOOYU_ANDROID_DEBUG_KEYSTORE: ${{ github.workspace }}/.local/ci-android/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing Android signing identity
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Configure ANDROID_DEBUG_KEYSTORE_BASE64 to preserve upgrade compatibility.' >&2; exit 1; }
          mkdir -p "$(dirname "$KOOYU_ANDROID_DEBUG_KEYSTORE")"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KOOYU_ANDROID_DEBUG_KEYSTORE"
          chmod 600 "$KOOYU_ANDROID_DEBUG_KEYSTORE"
      - name: Test, lint and build the Android APK
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: apps/android
      - name: Verify Android upgrade signing identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs apps/android/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/android-certificate.txt"
          grep -q 'SHA-256 digest: 45723986048e574269181defd74ac71aa826c02a43520296b0e29b8558bcad6f' "$RUNNER_TEMP/android-certificate.txt"
      - name: Name the Android artifact
        run: |
          mkdir -p release/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "release/android/Kooyu-${{ needs.metadata.outputs.version }}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kooyu-android
          path: release/android/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: apps/android/app/build/reports
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$KOOYU_ANDROID_DEBUG_KEYSTORE"
  ios:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Build iPhone and iPad simulator application
        run: xcodebuild -project Kooyu.xcodeproj -scheme Kooyu -destination 'generic/platform=iOS Simulator' -derivedDataPath build KOOYU_OFFICIAL_ACCOUNT_ORIGIN="$KOOYU_OFFICIAL_ACCOUNT_ORIGIN" KOOYU_OFFICIAL_RELAY_ORIGIN="$KOOYU_OFFICIAL_RELAY_ORIGIN" CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
      - name: Test on an available iPhone simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if "iPhone" in v["name"]))')
          xcodebuild -project Kooyu.xcodeproj -scheme Kooyu -destination "platform=iOS Simulator,id=$device_id" -derivedDataPath build -resultBundlePath build/KooyuTests.xcresult KOOYU_OFFICIAL_ACCOUNT_ORIGIN="$KOOYU_OFFICIAL_ACCOUNT_ORIGIN" KOOYU_OFFICIAL_RELAY_ORIGIN="$KOOYU_OFFICIAL_RELAY_ORIGIN" CODE_SIGNING_ALLOWED=NO test
        working-directory: apps/ios
      - name: Archive the simulator app preserving permissions
        run: |
          mkdir -p release/ios
          ditto -c -k --sequesterRsrc --keepParent apps/ios/build/Build/Products/Debug-iphonesimulator/Kooyu.app "release/ios/Kooyu-${{ needs.metadata.outputs.version }}-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kooyu-ios
          path: release/ios/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-reports
          path: apps/ios/build/KooyuTests.xcresult
  publish:
    needs: [metadata, checks, desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - uses: actions/download-artifact@v4
        with:
          pattern: kooyu-*
          path: release-assets
          merge-multiple: true
      - name: Publish all verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: node .github/scripts/release.mjs publish

